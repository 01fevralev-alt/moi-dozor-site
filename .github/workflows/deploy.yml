# Выгрузка сайта на хостинг reg.ru при каждом push в main (и вручную — кнопка Run workflow).
# Логин, пароль и адрес FTP — в Settings → Secrets and variables → Actions:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR (папка сайта на хостинге, со слэшем в конце, напр. www/xn--d1agelkcbq.xn--p1ai/)
# Выгружаются только изменённые файлы (состояние хранится на хостинге в .ftp-deploy-sync-state.json).
name: Выгрузка на хостинг

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - name: Нет настроек FTP — пропускаю
        if: env.HAS_FTP != 'true'
        run: echo "Секреты FTP_* ещё не заданы — выгрузка пропущена"
      - uses: actions/checkout@v4
        if: env.HAS_FTP == 'true'
      - name: FTP
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            backend/**
            tools/**
            backup/**
            data/**
            video/**
            **/.DS_Store
            CNAME
